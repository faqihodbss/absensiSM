<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Absensi Kegiatan Dept SM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Tambahan Library untuk Export PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <style>
        /* Custom Scrollbar for Dropdown */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 pb-12 font-sans">

    <!-- Header -->
    <header class="bg-blue-700 text-white shadow-md sticky top-0 z-10">
        <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <i class="fas fa-clipboard-user text-2xl"></i>
                <h1 class="text-xl font-bold">Absensi Dept SM</h1>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-6">
        <form id="attendance-form" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 md:p-8 space-y-6">
            
            <!-- INFORMASI KEGIATAN -->
            <div class="space-y-4">
                <h2 class="text-lg font-bold text-gray-800 border-b pb-2"><i class="fas fa-calendar-alt text-blue-600 mr-2"></i>Informasi Kegiatan</h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <!-- Tanggal -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Tanggal & Waktu</label>
                        <input type="datetime-local" id="tanggal" required readonly
                            class="w-full px-3 py-2 bg-gray-100 border border-gray-200 rounded-lg text-gray-600 focus:outline-none cursor-not-allowed transition-all">
                    </div>

                    <!-- Kegiatan -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nama Kegiatan</label>
                        <select id="kegiatan" required
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all bg-white">
                            <option value="" disabled selected>Pilih kegiatan...</option>
                            <option value="Sosialisasi Company Guideline">Sosialisasi Company Guideline</option>
                            <option value="Weekly Accountability Site to HO">Weekly Accountability Site to HO</option>
                            <option value="Weekly Accountability HO">Weekly Accountability HO</option>
                            <option value="Briefing Internal">Briefing Internal</option>
                            <option value="Sosialisasi APP Improvement">Sosialisasi APP Improvement</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- DATA KARYAWAN -->
            <div class="space-y-4 pt-4">
                <h2 class="text-lg font-bold text-gray-800 border-b pb-2"><i class="fas fa-user-tag text-blue-600 mr-2"></i>Data Karyawan</h2>
                
                <!-- NIK dengan Auto-Suggest -->
                <div class="relative">
                    <label class="block text-sm font-medium text-gray-700 mb-1">NIK / Nama <span class="text-xs text-gray-500 font-normal">(Ketik untuk mencari)</span></label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                            <i class="fas fa-id-badge"></i>
                        </span>
                        <input type="text" id="nik" placeholder="Masukkan NIK atau Nama..." required autocomplete="off"
                            class="w-full pl-10 pr-10 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                        <span class="absolute inset-y-0 right-0 flex items-center pr-3">
                            <i class="fas fa-search text-gray-400"></i>
                        </span>
                    </div>
                    
                    <!-- Suggestion Dropdown List -->
                    <ul id="nik-suggestions" class="absolute z-30 w-full bg-white border border-gray-200 rounded-xl mt-1 shadow-xl hidden max-h-56 overflow-y-auto custom-scrollbar divide-y divide-gray-100"></ul>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <!-- Nama -->
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">Nama Lengkap</label>
                        <textarea id="nama" rows="2" required readonly
                            class="w-full px-3 py-2 bg-gray-100 border border-gray-200 rounded-xl text-gray-600 text-sm focus:outline-none transition-colors resize-none custom-scrollbar"></textarea>
                    </div>

                    <!-- Jabatan -->
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">Jabatan</label>
                        <textarea id="jabatan" rows="2" required readonly
                            class="w-full px-3 py-2 bg-gray-100 border border-gray-200 rounded-xl text-gray-600 text-sm focus:outline-none transition-colors resize-none custom-scrollbar"></textarea>
                    </div>

                    <!-- Site -->
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">Site / Lokasi</label>
                        <textarea id="site" rows="2" required readonly
                            class="w-full px-3 py-2 bg-gray-100 border border-gray-200 rounded-xl text-gray-600 text-sm focus:outline-none transition-colors resize-none custom-scrollbar"></textarea>
                    </div>
                </div>
            </div>

            <!-- DOKUMENTASI & PARAF -->
            <div class="space-y-4 pt-4">
                <h2 class="text-lg font-bold text-gray-800 border-b pb-2"><i class="fas fa-camera text-blue-600 mr-2"></i>Verifikasi Kehadiran</h2>
                
                <div class="max-w-md mx-auto">
                    <!-- Dokumentasi Foto -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Dokumentasi (Selfie/Kegiatan)</label>
                        <div class="relative w-full h-48 border-2 border-dashed border-gray-300 rounded-xl bg-gray-50 flex flex-col items-center justify-center overflow-hidden group hover:border-blue-400 transition-colors">
                            
                            <input type="file" id="foto" accept="image/*" capture="environment" onchange="previewImage(event)"
                                class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                            
                            <div id="photo-placeholder" class="text-center p-4">
                                <div class="bg-blue-100 text-blue-600 w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-2 group-hover:scale-110 transition-transform">
                                    <i class="fas fa-camera text-xl"></i>
                                </div>
                                <p class="text-sm text-gray-500 font-medium">Ketuk untuk mengambil foto</p>
                            </div>

                            <img id="photo-preview" src="" alt="Preview" class="absolute inset-0 w-full h-full object-cover hidden">
                            
                            <button type="button" id="btn-remove-photo" onclick="removePhoto()" class="absolute top-2 right-2 bg-red-500 text-white p-2 rounded-full text-xs hidden z-20 hover:bg-red-600 shadow-md">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- SUBMIT BUTTON -->
            <div class="pt-6">
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-blue-200 transition-all active:scale-[0.98] flex items-center justify-center text-lg">
                    <i class="fas fa-paper-plane mr-2"></i> Simpan Data Kehadiran
                </button>
            </div>

        </form>

        <!-- INFORMASI KARYAWAN YANG SUDAH ABSEN -->
        <div class="mt-8 bg-white rounded-2xl shadow-sm border border-gray-100 p-5 md:p-8 space-y-4">
            <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center border-b pb-3 gap-3">
                <h2 class="text-lg font-bold text-gray-800"><i class="fas fa-list-check text-green-600 mr-2"></i>Karyawan Sudah Absen</h2>
                <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto">
                    <select id="filter-kegiatan" onchange="renderAttendanceList()" class="text-sm px-2 py-1.5 border border-gray-300 rounded-lg outline-none flex-grow sm:flex-grow-0 bg-gray-50 focus:ring-2 focus:ring-blue-500">
                        <option value="Semua">Semua Kegiatan</option>
                        <option value="Sosialisasi Company Guideline">Sosialisasi Company Guideline</option>
                        <option value="Weekly Accountability Site to HO">Weekly Accountability Site to HO</option>
                        <option value="Weekly Accountability HO">Weekly Accountability HO</option>
                        <option value="Briefing Internal">Briefing Internal</option>
                        <option value="Sosialisasi APP Improvement">Sosialisasi APP Improvement</option>
                    </select>
                    <button type="button" onclick="loadRecentAttendance()" class="text-sm text-blue-600 hover:text-blue-800 transition-colors flex items-center whitespace-nowrap bg-blue-50 hover:bg-blue-100 px-3 py-1.5 rounded-lg font-medium">
                        <i class="fas fa-sync-alt mr-1"></i> Segarkan
                    </button>
                    <!-- Tombol Unduh PDF -->
                    <button type="button" onclick="downloadPDF()" class="text-sm text-red-600 hover:text-red-800 transition-colors flex items-center whitespace-nowrap bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-lg font-medium shadow-sm">
                        <i class="fas fa-file-pdf mr-1"></i> Unduh PDF
                    </button>
                </div>
            </div>
            
            <div id="attendance-list" class="max-h-80 overflow-y-auto custom-scrollbar space-y-3 pr-2">
                <div class="text-center text-gray-500 py-6">
                    <i class="fas fa-circle-notch fa-spin text-2xl mb-2 text-blue-500"></i>
                    <p>Memuat data absensi...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Alert -->
    <div id="alert-modal" class="fixed inset-0 bg-gray-900 bg-opacity-50 z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-2xl p-6 m-4 max-w-sm w-full shadow-2xl transform scale-95 transition-transform duration-300" id="alert-box">
            <div id="alert-icon" class="w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl"></div>
            <h3 id="alert-title" class="text-xl font-bold text-center text-gray-800 mb-2"></h3>
            <p id="alert-message" class="text-center text-gray-600 mb-6"></p>
            <button onclick="closeModal()" class="w-full py-3 rounded-xl font-bold text-white transition-colors" id="alert-btn">Tutup</button>
        </div>
    </div>

    <script>
        // --- KONFIGURASI BACKEND ---
        // Link exec Google Apps Script yang Anda berikan
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzKe5O4t25RN2s4agqawOb4GUTVI_qlev4uxEOjW6B0eRkOcnoegXsz6HTGnp7anAZ5/exec';
        
        let photoBase64 = ""; // Variabel penyimpan foto

        window.addEventListener('DOMContentLoaded', () => {
            // Set Default Date Input ke Waktu Saat Ini
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('tanggal').value = now.toISOString().slice(0, 16);
            
            loadDatabasePegawai(); 
            loadRecentAttendance(); // Memuat daftar absen saat aplikasi pertama dibuka
        });

        // --- 1. FITUR DATABASE & AUTO-SUGGEST ---
        let dbPegawai = {};
        const dbUrl = 'https://docs.google.com/spreadsheets/d/1sMaQqH1dId-j_kQblFnJicyzCpCwTstyUPVFnGxvWvk/export?format=csv&gid=0';

        async function loadDatabasePegawai() {
            try {
                const response = await fetch(dbUrl);
                if (!response.ok) throw new Error('Gagal memuat data dari server');
                
                const csvText = await response.text();
                const rows = csvText.split(/\r?\n/);
                
                if (rows.length > 1) {
                    const headers = rows[0].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(h => h.replace(/"/g, '').trim().toLowerCase());
                    const nikIdx = headers.findIndex(h => h.includes('nik'));
                    const namaIdx = headers.findIndex(h => h.includes('nama'));
                    const jabatanIdx = headers.findIndex(h => h.includes('jabatan') || h.includes('posisi'));
                    const siteIdx = headers.findIndex(h => h.includes('site') || h.includes('lokasi') || h.includes('area'));
                    
                    for (let i = 1; i < rows.length; i++) {
                        if (!rows[i].trim()) continue;
                        const cols = rows[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/"/g, '').trim());
                        
                        if (nikIdx !== -1 && cols[nikIdx]) {
                            const nik = cols[nikIdx];
                            dbPegawai[nik] = {
                                nama: namaIdx !== -1 && cols[namaIdx] ? cols[namaIdx] : '-',
                                jabatan: jabatanIdx !== -1 && cols[jabatanIdx] ? cols[jabatanIdx] : '-',
                                site: siteIdx !== -1 && cols[siteIdx] ? cols[siteIdx] : '-'
                            };
                        }
                    }
                }
            } catch (error) {
                console.error("Error loading CSV:", error);
                // Allow manual input if DB fails
                ['nama', 'jabatan', 'site'].forEach(id => {
                    document.getElementById(id).removeAttribute('readonly');
                    document.getElementById(id).classList.replace('bg-gray-100', 'bg-gray-50');
                });
            }
        }

        const nikInput = document.getElementById('nik');
        const suggestionBox = document.getElementById('nik-suggestions');

        function applyAutoFill(nik) {
            const data = dbPegawai[nik];
            if(!data) return;
            document.getElementById('nama').value = data.nama;
            document.getElementById('jabatan').value = data.jabatan;
            document.getElementById('site').value = data.site;
        }

        function resetAutoFill() {
            document.getElementById('nama').value = '';
            document.getElementById('jabatan').value = '';
            document.getElementById('site').value = '';
        }

        nikInput.addEventListener('input', function() {
            const query = this.value.toLowerCase().trim();
            suggestionBox.innerHTML = '';
            
            if (dbPegawai[query]) {
                applyAutoFill(query);
                suggestionBox.classList.add('hidden');
                return;
            } else {
                resetAutoFill();
            }

            if (query.length < 2) {
                suggestionBox.classList.add('hidden');
                return;
            }

            const matches = Object.keys(dbPegawai).filter(nik => {
                const nama = dbPegawai[nik].nama.toLowerCase();
                return nik.toLowerCase().includes(query) || nama.includes(query);
            }).slice(0, 8); 

            if (matches.length > 0) {
                matches.forEach(nik => {
                    const data = dbPegawai[nik];
                    const li = document.createElement('li');
                    li.className = 'px-4 py-3 hover:bg-blue-50 cursor-pointer transition-colors flex flex-col';
                    li.innerHTML = `
                        <span class="font-bold text-gray-800">${data.nama}</span>
                        <span class="text-xs text-gray-500">NIK: ${nik} | ${data.jabatan}</span>
                    `;
                    li.addEventListener('mousedown', function() {
                        nikInput.value = nik;
                        applyAutoFill(nik);
                        suggestionBox.classList.add('hidden');
                    });
                    suggestionBox.appendChild(li);
                });
                suggestionBox.classList.remove('hidden');
            } else {
                suggestionBox.classList.add('hidden');
            }
        });

        document.addEventListener('mousedown', function(e) {
            if (!suggestionBox.contains(e.target) && e.target !== nikInput) {
                suggestionBox.classList.add('hidden');
            }
        });

        // --- 2. FITUR KAMERA / DOKUMENTASI ---
        function previewImage(event) {
            const input = event.target;
            const preview = document.getElementById('photo-preview');
            const placeholder = document.getElementById('photo-placeholder');
            const btnRemove = document.getElementById('btn-remove-photo');

            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const MAX_WIDTH = 800; 
                        const MAX_HEIGHT = 800;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {
                                width *= MAX_HEIGHT / height;
                                height = MAX_HEIGHT;
                            }
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        photoBase64 = canvas.toDataURL('image/jpeg', 0.7); 
                        
                        preview.src = photoBase64;
                        preview.classList.remove('hidden');
                        placeholder.classList.add('hidden');
                        btnRemove.classList.remove('hidden');
                    }
                    img.src = e.target.result;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function removePhoto() {
            document.getElementById('foto').value = "";
            photoBase64 = "";
            document.getElementById('photo-preview').src = "";
            document.getElementById('photo-preview').classList.add('hidden');
            document.getElementById('photo-placeholder').classList.remove('hidden');
            document.getElementById('btn-remove-photo').classList.add('hidden');
        }

        // --- 3. FITUR RIWAYAT ABSENSI TERBARU DENGAN FILTER ---
        const attendanceUrl = 'https://docs.google.com/spreadsheets/d/1sMaQqH1dId-j_kQblFnJicyzCpCwTstyUPVFnGxvWvk/export?format=csv&gid=611035354';
        let allAttendanceData = []; // Menyimpan data master agar tidak perlu load ulang saat filter

        async function loadRecentAttendance() {
            const listContainer = document.getElementById('attendance-list');
            listContainer.innerHTML = `
                <div class="text-center text-gray-500 py-6">
                    <i class="fas fa-circle-notch fa-spin text-2xl mb-2 text-blue-500"></i>
                    <p>Memuat data absensi terbaru...</p>
                </div>`;
            
            try {
                const response = await fetch(attendanceUrl);
                if (!response.ok) throw new Error('Gagal memuat data dari spreadsheet');
                
                const csvText = await response.text();
                const rows = csvText.split(/\r?\n/);
                
                if (rows.length > 1) {
                    // Hilangkan header, hapus baris kosong, dan balik urutan (terbaru di atas)
                    const dataRows = rows.slice(1).filter(r => r.trim() !== '').reverse();
                    
                    // Parsing semua data ke dalam array object
                    allAttendanceData = dataRows.map(row => {
                        const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/"/g, '').trim());
                        return {
                            tanggal: cols[0] ? cols[0].replace('T', ' ') : '-',
                            kegiatan: cols[1] || '-',
                            nik: cols[2] || '-',
                            nama: cols[3] || 'Hamba Allah',
                            jabatan: cols[4] || '-',
                            site: cols[5] || '-'
                        };
                    });
                    
                    // Render list dengan fungsi baru
                    renderAttendanceList();
                } else {
                    allAttendanceData = [];
                    renderAttendanceList();
                }
            } catch (error) {
                console.error("Error loading attendance:", error);
                listContainer.innerHTML = `
                    <div class="text-center text-red-500 py-6">
                        <i class="fas fa-exclamation-triangle text-2xl mb-2"></i>
                        <p>Gagal memuat data riwayat absensi.</p>
                        <p class="text-xs text-gray-400 mt-1">Pastikan Spreadsheet memiliki akses "Siapa saja yang memiliki link" sebagai pelihat.</p>
                    </div>`;
            }
        }

        // Fungsi terpisah untuk me-render list agar filter bisa bekerja tanpa fetch ulang
        function renderAttendanceList() {
            const listContainer = document.getElementById('attendance-list');
            const filterVal = document.getElementById('filter-kegiatan').value;
            
            let filteredData = allAttendanceData;
            
            // Terapkan filter jika bukan "Semua"
            if (filterVal !== 'Semua') {
                filteredData = allAttendanceData.filter(item => item.kegiatan === filterVal);
            }

            if (filteredData.length === 0) {
                listContainer.innerHTML = '<div class="text-center text-gray-500 py-6">Belum ada data absensi yang cocok dengan filter.</div>';
                return;
            }

            let html = '';
            // Batasi untuk menampilkan maksimal 30 absensi terakhir yang sudah difilter
            const limit = Math.min(filteredData.length, 30);
            
            for (let i = 0; i < limit; i++) {
                const data = filteredData[i];
                html += `
                    <div class="p-3.5 bg-gray-50 border border-gray-100 rounded-xl flex flex-col sm:flex-row sm:items-center justify-between gap-3 hover:bg-blue-50 transition-colors">
                        <div class="flex items-start gap-3">
                            <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold flex-shrink-0">
                                ${data.nama.charAt(0).toUpperCase()}
                            </div>
                            <div>
                                <p class="font-bold text-gray-800 text-sm leading-tight">${data.nama}</p>
                                <p class="text-xs text-gray-500 mt-1"><span class="font-medium text-gray-700">${data.kegiatan}</span> • ${data.site}</p>
                            </div>
                        </div>
                        <div class="text-xs font-semibold text-green-700 bg-green-100 px-2.5 py-1.5 rounded-lg self-start sm:self-auto whitespace-nowrap flex items-center">
                            <i class="far fa-clock mr-1.5"></i> ${data.tanggal}
                        </div>
                    </div>
                `;
            }
            listContainer.innerHTML = html;
        }

        // --- FITUR UNDUH PDF ---
        function downloadPDF() {
            if (typeof window.jspdf === 'undefined') {
                showModal('error', 'Library PDF Gagal', 'Library untuk membuat PDF belum termuat, pastikan koneksi internet stabil lalu segarkan halaman.');
                return;
            }

            const filterVal = document.getElementById('filter-kegiatan').value;
            let filteredData = allAttendanceData;
            
            if (filterVal !== 'Semua') {
                filteredData = allAttendanceData.filter(item => item.kegiatan === filterVal);
            }

            if (filteredData.length === 0) {
                showModal('error', 'Data Kosong', 'Tidak ada data absensi untuk diunduh pada pilihan filter saat ini.');
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('landscape', 'pt', 'a4'); // Format lanskap agar tabel muat banyak

            // Header Dokumen
            doc.setFontSize(16);
            doc.setFont('helvetica', 'bold');
            doc.text('Laporan Absensi Dept SM', 40, 40);
            
            doc.setFontSize(10);
            doc.setFont('helvetica', 'normal');
            doc.text(`Filter Kegiatan : ${filterVal}`, 40, 60);
            doc.text(`Waktu Unduh  : ${new Date().toLocaleString('id-ID')}`, 40, 75);

            // Menyiapkan Data Tabel
            const tableColumn = ["Tanggal & Waktu", "Nama Kegiatan", "NIK", "Nama Lengkap", "Jabatan", "Site / Lokasi"];
            const tableRows = [];

            filteredData.forEach(data => {
                const rowData = [
                    data.tanggal,
                    data.kegiatan,
                    data.nik,
                    data.nama,
                    data.jabatan,
                    data.site
                ];
                tableRows.push(rowData);
            });

            // Membuat Tabel dengan AutoTable
            doc.autoTable({
                head: [tableColumn],
                body: tableRows,
                startY: 90,
                theme: 'grid',
                styles: { fontSize: 9, cellPadding: 4, font: 'helvetica' },
                headStyles: { fillColor: [29, 78, 216], textColor: [255, 255, 255], fontStyle: 'bold' }, // Warna biru tema (Tailwind blue-700)
                alternateRowStyles: { fillColor: [249, 250, 251] }, // Baris selang-seling abu-abu (gray-50)
                margin: { top: 90, left: 40, right: 40, bottom: 40 }
            });

            // Penamaan File Dinamis
            const dateStr = new Date().toISOString().slice(0,10);
            const fileName = `Rekap_Absensi_${filterVal.replace(/\s+/g, '_')}_${dateStr}.pdf`;
            
            doc.save(fileName);
        }

        // --- 4. SUBMIT FORM & KIRIM KE GOOGLE SHEETS ---
        const form = document.getElementById('attendance-form');
        
        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            if (!photoBase64) {
                showModal('error', 'Dokumentasi Kosong', 'Mohon lampirkan foto dokumentasi kegiatan terlebih dahulu.');
                return;
            }

            const btnSubmit = form.querySelector('button[type="submit"]');
            const originalBtnText = btnSubmit.innerHTML;
            btnSubmit.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Sedang Menyimpan Data...';
            btnSubmit.disabled = true;
            btnSubmit.classList.add('opacity-75', 'cursor-not-allowed');

            const payload = {
                tanggal: document.getElementById('tanggal').value,
                kegiatan: document.getElementById('kegiatan').value,
                nik: document.getElementById('nik').value,
                nama: document.getElementById('nama').value,
                jabatan: document.getElementById('jabatan').value,
                site: document.getElementById('site').value,
                foto: photoBase64
            };

            try {
                // Menambahkan mode: 'no-cors' karena browser sering memblokir (CORS) pengiriman data langsung ke Google Script
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'text/plain',
                    },
                    body: JSON.stringify(payload)
                });

                // Karena mode 'no-cors', respons server bersifat "opaque" dan kita tidak bisa membaca JSON dari server.
                // Jika tidak masuk ke blok 'catch', berarti fetch berhasil dikirim ke jaringan.
                showModal('success', 'Absensi Berhasil!', 'Data kehadiran Anda telah tercatat ke dalam sistem.');
                
                form.reset();
                resetAutoFill();
                removePhoto();
                
                const now = new Date();
                now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
                document.getElementById('tanggal').value = now.toISOString().slice(0, 16);

                // Memuat ulang daftar absen secara otomatis setelah 2 detik
                // (Jeda waktu agar data sempat tersimpan di Google Sheets oleh backend)
                setTimeout(loadRecentAttendance, 2000);

            } catch (error) {
                console.error("Submit Error:", error);
                showModal('error', 'Gagal Mengirim Data', 'Terjadi kesalahan jaringan atau koneksi. Pastikan internet stabil dan coba lagi.');
            } finally {
                btnSubmit.innerHTML = originalBtnText;
                btnSubmit.disabled = false;
                btnSubmit.classList.remove('opacity-75', 'cursor-not-allowed');
            }
        });

        // --- 5. LOGIKA MODAL ---
        const modal = document.getElementById('alert-modal');
        const alertBox = document.getElementById('alert-box');
        
        function showModal(type, title, message) {
            const icon = document.getElementById('alert-icon');
            const btn = document.getElementById('alert-btn');
            
            document.getElementById('alert-title').innerText = title;
            document.getElementById('alert-message').innerText = message;
            
            if (type === 'success') {
                icon.innerHTML = '<i class="fas fa-check"></i>';
                icon.className = 'w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-4xl bg-green-100 text-green-500';
                btn.className = 'w-full py-3 rounded-xl font-bold text-white transition-colors bg-green-500 hover:bg-green-600 shadow-lg shadow-green-200';
            } else {
                icon.innerHTML = '<i class="fas fa-exclamation"></i>';
                icon.className = 'w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-4xl bg-red-100 text-red-500';
                btn.className = 'w-full py-3 rounded-xl font-bold text-white transition-colors bg-red-500 hover:bg-red-600 shadow-lg shadow-red-200';
            }
            
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                alertBox.classList.remove('scale-95');
                alertBox.classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            modal.classList.add('opacity-0');
            alertBox.classList.remove('scale-100');
            alertBox.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }
    </script>
</body>
</html>
